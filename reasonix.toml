language = "zh"
[permissions]
allow = ["Bash=cd /e/go/SSL-Assistant && cat > zz_dbtmp.go <<'EOF'\npackage main\n\nimport (\n\t\"fmt\"\n\t\"ssl_assistant/db\"\n)\n\nfunc main() {\n\tc1 := db.Certificate{Domain: \"b.com\", Status: \"有效\", CreateTime: 1, ExpireTime: 2, PublicKey: \"p\", PrivateKey: \"k\", CertPath: \"/c\", KeyPath: \"/k\", CertSource: \"certd\", CertID: 66, CertDomains: \"b.com,www.b.com\"}\n\tif err := db.AddCertificateToDBWrapper(c1); err != nil {\n\t\tpanic(err)\n\t}\n\tgot, _ := db.GetCertificateWrapper(\"b.com\")\n\tfmt.Println(\"Badger CertID:\", got.CertID, \"CertDomains:\", got.CertDomains)\n}\nEOF\nUSERPROFILE=/tmp/ssl_fake_h6 CGO_ENABLED=0 go run zz_dbtmp.go 2>&1 | grep -v \"SQLite数据库初始化失败\\|尝试使用纯Go\\|成功切换到BadgerDB\"; echo \"---exit: ${PIPESTATUS[0]}---\"; rm -f zz_dbtmp.go; rm -rf /tmp/ssl_fake_h6", "Bash=curl -s \"https://grep.app/api/search?q=notAfter&filter%5Brepo%5D%5B0%5D=certd/certd\" 2>/dev/null | python -c \"\nimport json,sys\nd=json.load(sys.stdin)\nfor h in d.get('hits',{}).get('hits',[]):\n    print(h.get('repo',{}).get('raw'), h.get('path',{}).get('raw'))\n    for s in h.get('content',{}).get('snippets',[]):\n        print('   ', s.get('data','').replace(chr(10),' | ')[:200])\n\" 2>&1 | head -40", "Bash=curl -s \"https://api.github.com/repos/certd/certd/git/trees/master?recursive=1\" 2>/dev/null | python -c \"\nimport json,sys\nd=json.load(sys.stdin)\npaths=[t['path'] for t in d.get('tree',[]) if 'openapi' in t['path'].lower() or 'cert/get' in t['path'].lower()]\nprint(chr(10).join(paths[:40]))\n\" 2>&1 | head -40", "Bash=curl -s -m 60 \"https://api.github.com/repos/certd/certd/git/trees/master?recursive=1\" -o /tmp/certd_tree.json 2>/dev/null; python -c \"\nimport json\nd=json.load(open('/tmp/certd_tree.json',encoding='utf-8'))\nfor t in d.get('tree',[]):\n    p=t['path']\n    if 'openapi' in p.lower() or 'api.controller' in p.lower() or ('plugin-cert' in p and 'controller' in p.lower()):\n        print(p)\n\" 2>&1 | head -40", "Bash=curl -s -m 30 \"https://api.github.com/repos/certd/certd/contents/packages/plugins/plugin-cert/src\" 2>/dev/null | python -c \"\nimport json,sys\nd=json.load(sys.stdin)\nfor t in d:\n    print(t['type'], t['path'])\n\" 2>&1 | head -30", "Bash=for br in main master; do echo \"== $br ==\"; curl -s -m 20 \"https://raw.githubusercontent.com/certd/certd/$br/packages/plugins/plugin-cert/src/index.ts\" 2>/dev/null | head -5; done", "Bash=curl -s -m 30 \"https://raw.githubusercontent.com/certd/certd/v2/packages/plugins/plugin-cert/src/index.ts\" -o /tmp/idx.ts 2>/dev/null; wc -c /tmp/idx.ts; curl -s -m 30 \"https://api.github.com/repos/certd/certd/git/trees/v2?recursive=1\" -o /tmp/t2.json 2>/dev/null; wc -c /tmp/t2.json; python -c \"\nimport json\nd=json.load(open('/tmp/t2.json',encoding='utf-8'))\nfor t in d.get('tree',[]):\n    p=t['path']\n    if 'openapi' in p.lower() and p.endswith(('.ts','.java','.js')):\n        print(p)\n\" 2>&1 | head -30", "Bash=cd /e/go/SSL-Assistant && curl -s -m 60 \"https://api.github.com/repos/certd/certd/git/trees/v2?recursive=1\" -o t2.json 2>/dev/null; python -c \"\nimport json\nd=json.load(open('t2.json',encoding='utf-8'))\nfor t in d.get('tree',[]):\n    p=t['path']\n    if 'openapi' in p.lower() and p.endswith('.ts'):\n        print(p)\n\" 2>&1 | head -20", "Bash=cd /e/go/SSL-Assistant && for f in cert-reader.ts cert-reader/index.ts; do echo \"== $f ==\"; curl -s -m 20 \"https://raw.githubusercontent.com/certd/certd/v2/packages/plugins/plugin-cert/src/$f\" | grep -n \"expires\\|notAfter\\|getTime\\|1000\\|valid_to\\|validTo\" | head; done", "Bash=cd /e/go/SSL-Assistant && python -c \"\nimport json\nd=json.load(open('t2.json',encoding='utf-8'))\nfor t in d.get('tree',[]):\n    p=t['path']\n    if 'cert-reader' in p.lower() or 'cert-info.ts' in p.lower():\n        print(p)\n\" | head", "Bash=curl -s -m 30 \"https://api.github.com/repos/Youngxj/SSL-Assistant/issues/3\" 2>/dev/null | python -c \"\nimport json,sys\nd=json.load(sys.stdin)\nprint('标题:', d.get('title'))\nprint('状态:', d.get('state'))\nprint('创建人:', (d.get('user') or {}).get('login'))\nprint('创建时间:', d.get('created_at'))\nprint('---正文---')\nprint(d.get('body'))\n\" 2>&1", "Bash=cd /e/go/SSL-Assistant && curl -s -m 30 \"https://api.github.com/repos/Youngxj/SSL-Assistant/issues/3/comments\" -o /tmp/ic.json 2>/dev/null; python -c \"\nimport json\nd=json.load(open('/tmp/ic.json',encoding='utf-8'))\nfor c in d:\n    print('===', c['user']['login'], c['created_at'], '===')\n    print(c['body'][:800])\n\" 2>&1; rm -f /tmp/ic.json", "Bash=cd /e/go/SSL-Assistant && curl -s -m 30 \"https://api.github.com/repos/Youngxj/SSL-Assistant/issues/3/comments\" -o ic.json 2>/dev/null && python -c \"\nimport json\nd=json.load(open('ic.json',encoding='utf-8'))\nprint('评论数:', len(d))\nfor c in d:\n    print('===', c['user']['login'], c['created_at'], '===')\n    print(c['body'][:1000])\n\" 2>&1; rm -f ic.json", "Bash=cd /e/go/SSL-Assistant && PYTHONIOENCODING=utf-8 python -c \"\nimport urllib.request, json\nd=json.load(urllib.request.urlopen('https://api.github.com/repos/Youngxj/SSL-Assistant/issues/3'))\nprint('标题:', d['title'])\nprint('正文:', d['body'])\nfor c in json.load(urllib.request.urlopen('https://api.github.com/repos/Youngxj/SSL-Assistant/issues/3/comments')):\n    print('评论(%s):' % c['user']['login'], c['body'])\n\" 2>&1"]


